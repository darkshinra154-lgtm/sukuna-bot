<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukuna Platform | منصة سوكونا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Animated Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(138, 43, 226, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 128, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(0, 255, 255, 0.05) 0%, transparent 50%);
      animation: pulse 8s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
    }

    /* Logo Section */
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo-icon {
      font-size: 4rem;
      margin-bottom: 10px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .logo-title {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a855f7, #ec4899, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      letter-spacing: 2px;
    }

    .logo-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      margin-top: 5px;
      letter-spacing: 3px;
    }

    /* Main Card */
    .card {
      background: rgba(20, 20, 40, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(168, 85, 247, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(30, 30, 50, 0.8);
      border-radius: 16px;
      padding: 6px;
      margin-bottom: 30px;
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .tab {
      flex: 1;
      padding: 14px 20px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab.active {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }

    .tab:not(.active):hover {
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Tab Content */
    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Input Styles */
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-label {
      display: block;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      padding: 16px 20px;
      padding-right: 50px;
      background: rgba(30, 30, 50, 0.6);
      border: 2px solid rgba(168, 85, 247, 0.3);
      border-radius: 14px;
      color: white;
      font-size: 1.1rem;
      font-family: 'Tajawal', sans-serif;
      transition: all 0.3s ease;
      text-align: center;
      direction: ltr;
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .input-field:focus {
      outline: none;
      border-color: #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      background: rgba(40, 40, 60, 0.8);
    }

    .input-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      opacity: 0.5;
    }

    /* Button */
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .btn-pair {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
    }

    .btn-qr {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(168, 85, 247, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Result Section */
    .result-section {
      margin-top: 30px;
      padding: 25px;
      background: rgba(30, 30, 50, 0.6);
      border-radius: 16px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      display: none;
      animation: fadeIn 0.5s ease-out;
    }

    .result-section.show {
      display: block;
    }

    .result-title {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.85rem;
      margin-bottom: 12px;
      text-align: center;
    }

    .code-display {
      font-family: 'Courier New', monospace;
      font-size: 2rem;
      font-weight: 900;
      color: #fbbf24;
      text-align: center;
      letter-spacing: 8px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      border: 2px dashed rgba(251, 191, 36, 0.3);
      margin-bottom: 15px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .qr-image {
      display: block;
      margin: 0 auto;
      max-width: 250px;
      border-radius: 16px;
      border: 4px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .result-hint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.6;
    }

    /* Status */
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: 500;
      display: none;
    }

    .status.show {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }

    .status.loading {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .status.success {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status.error {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 30px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.8rem;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .footer a {
      color: #a855f7;
      text-decoration: none;
    }

    /* Copy Button */
    .copy-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      color: #a855f7;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .copy-btn:hover {
      background: rgba(168, 85, 247, 0.3);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      .logo-title {
        font-size: 2rem;
      }
      .code-display {
        font-size: 1.5rem;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-icon">🕸️</div>
      <h1 class="logo-title">SUKUNA BOT</h1>
      <p class="logo-subtitle">◈ PLATFORM ◈</p>
    </div>

    <!-- Main Card -->
    <div class="card">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('pair')" id="pairTab">
          <span>🔢</span>
          <span>كود ربط</span>
        </button>
        <button class="tab" onclick="switchTab('qr')" id="qrTab">
          <span>🔳</span>
          <span>QR Code</span>
        </button>
      </div>

      <!-- Pair Tab Content -->
      <div class="tab-content active" id="pairContent">
        <div class="input-group">
          <label class="input-label">رقم الواتساب (بصيغة دولية)</label>
          <input 
            type="tel" 
            id="phoneInput" 
            class="input-field" 
            placeholder="201012345678"
            maxlength="15"
          >
          <span class="input-icon">📱</span>
        </div>
        <button class="btn btn-pair" onclick="getPairCode()" id="pairBtn">
          <span>⚡</span>
          <span>توليد كود الربط</span>
        </button>
        
        <div class="result-section" id="pairResult">
          <div class="result-title">🔑 كود الربط الخاص بك</div>
          <div class="code-display" id="codeDisplay">----</div>
          <div class="result-hint">
            افتح واتساب → الأجهزة المرتبطة → ربط برقم الهاتف<br>
            ثم أدخل الكود أعلاه
          </div>
          <center>
            <button class="copy-btn" onclick="copyCode()">📋 نسخ الكود</button>
          </center>
        </div>
      </div>

      <!-- QR Tab Content -->
      <div class="tab-content" id="qrContent">
        <button class="btn btn-qr" onclick="getQRCode()" id="qrBtn">
          <span>📷</span>
          <span>عرض كود QR</span>
        </button>
        
        <div class="result-section" id="qrResult">
          <div class="result-title">📸 امسح الكود بكاميرا واتساب</div>
          <img id="qrImage" class="qr-image" src="" alt="QR Code">
          <div class="result-hint" style="margin-top: 15px;">
            افتح واتساب → الأجهزة المرتبطة → ربط جهاز<br>
            ثم امسح الكود
          </div>
        </div>
      </div>

      <!-- Status -->
      <div class="status" id="status"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>© 2026 Sukuna Bot Platform | Powered by <a href="#">SUKUNA (TEAM)</a></p>
      <p style="margin-top: 5px; font-size: 0.7rem;">◈⏤͟͟͞͞𝐒𝐮𝐤𝐮𝐧𝐚 𝐁𝐨𝐭↯↯</p>
    </div>
  </div>

  <script>
    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (tab === 'pair') {
        document.getElementById('pairTab').classList.add('active');
        document.getElementById('pairContent').classList.add('active');
      } else {
        document.getElementById('qrTab').classList.add('active');
        document.getElementById('qrContent').classList.add('active');
      }
      
      // Hide results when switching
      hideResults();
    }

    function hideResults() {
      document.getElementById('pairResult').classList.remove('show');
      document.getElementById('qrResult').classList.remove('show');
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.className = 'status show ' + type;
      status.innerHTML = message;
    }

    function hideStatus() {
      document.getElementById('status').className = 'status';
    }

    // Get Pair Code
    async function getPairCode() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) {
        showStatus('⚠️ الرجاء إدخال رقم الواتساب', 'error');
        return;
      }

      const digits = phone.replace(/\D/g, '');
      if (digits.length < 8) {
        showStatus('⚠️ رقم الواتساب غير صحيح', 'error');
        return;
      }

      const btn = document.getElementById('pairBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span><span>جاري التوليد...</span>';
      showStatus('⏳ جاري الاتصال بالخادم...', 'loading');
      hideResults();

      try {
        const res = await fetch(`/pair?number=${digits}`);
        const data = await res.json();

        if (data.code && data.code !== 'SUCCESS' && data.code !== 'ERROR') {
          document.getElementById('codeDisplay').textContent = data.code;
          document.getElementById('pairResult').classList.add('show');
          showStatus('✅ تم توليد الكود بنجاح', 'success');
        } else if (data.code === 'SUCCESS') {
          showStatus('✅ تم الربط بنجاح! جاري إرسال الجلسة للبوت الرئيسي...', 'success');
          document.getElementById('phoneInput').value = '';
        } else {
          showStatus('❌ ' + (data.message || 'حدث خطأ'), 'error');
        }
      } catch (e) {
        showStatus('❌ فشل الاتصال بالخادم', 'error');
      }

      btn.disabled = false;
      btn.innerHTML = '<span>⚡</span><span>توليد كود الربط</span>';
    }

    // Get QR Code
    async function getQRCode() {
      const btn = document.getElementById('qrBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span><span>جاري التوليد...</span>';
      showStatus('⏳ جاري إنشاء كود QR...', 'loading');
      hideResults();

      try {
        const res = await fetch('/qr');
        const data = await res.json();

        if (data.qr) {
          document.getElementById('qrImage').src = data.qr;
          document.getElementById('qrResult').classList.add('show');
          showStatus('✅ امسح الكود الآن بكاميرا واتساب', 'success');
        } else {
          showStatus('❌ فشل توليد كود QR', 'error');
        }
      } catch (e) {
        showStatus('❌ فشل الاتصال بالخادم', 'error');
      }

      btn.disabled = false;
      btn.innerHTML = '<span>📷</span><span>عرض كود QR</span>';
    }

    // Copy Code
    function copyCode() {
      const code = document.getElementById('codeDisplay').textContent;
      if (code && code !== '----') {
        navigator.clipboard.writeText(code).then(() => {
          showStatus('📋 تم نسخ الكود!', 'success');
          setTimeout(hideStatus, 2000);
        });
      }
    }

    // Enter key support
    document.getElementById('phoneInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') getPairCode();
    });

    // Input formatting
    document.getElementById('phoneInput').addEventListener('input', function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>

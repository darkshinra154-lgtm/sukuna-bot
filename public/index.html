<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukuna Bot | منصة التنصيب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
    body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #e2e8f0; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    .neon-text { text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="glass rounded-2xl shadow-2xl w-full max-w-md p-8 text-center">
    <h1 class="text-4xl font-bold mb-2 neon-text text-purple-400">SUKUNA BOT</h1>
    <p class="text-gray-400 mb-8">منصة تنصيب البوتات الفرعية</p>

    <div class="flex mb-6 bg-slate-800 rounded-lg p-1">
      <button id="pairTab" class="flex-1 py-2 rounded-md bg-purple-600 text-white transition">كود ربط</button>
      <button id="qrTab" class="flex-1 py-2 rounded-md text-gray-400 transition">QR Code</button>
    </div>

    <div id="pairSection">
      <input type="tel" id="phone" placeholder="رقم الواتساب بصيغة دولية (2010...)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 mb-4 focus:outline-none focus:border-purple-500 text-center">
      <button onclick="getPairCode()" class="w-full bg-gradient-to-r from-purple-600 to-blue-600 py-3 rounded-lg font-bold hover:opacity-90 transition">توليد الكود</button>
      <div id="pairResult" class="mt-6 hidden">
        <p class="text-gray-400 text-sm">كود الربط الخاص بك:</p>
        <div class="text-3xl font-mono font-bold text-yellow-400 tracking-widest mt-2" id="codeDisplay"></div>
        <p class="text-xs text-gray-500 mt-2">أدخل الكود في واتساب > الأجهزة المرتبطة > ربط برقم الهاتف</p>
      </div>
    </div>

    <div id="qrSection" class="hidden">
      <button onclick="getQRCode()" class="w-full bg-gradient-to-r from-green-600 to-teal-600 py-3 rounded-lg font-bold hover:opacity-90 transition">عرض كود QR</button>
      <div id="qrResult" class="mt-6 hidden">
        <img id="qrImage" src="" alt="QR Code" class="mx-auto rounded-lg border-4 border-slate-700">
        <p class="text-xs text-gray-500 mt-2">امسح الكود بكاميرا واتساب</p>
      </div>
    </div>

    <div id="status" class="mt-6 text-sm text-purple-300"></div>
  </div>

  <script>
    const pairTab = document.getElementById('pairTab');
    const qrTab = document.getElementById('qrTab');
    const pairSection = document.getElementById('pairSection');
    const qrSection = document.getElementById('qrSection');

    pairTab.onclick = () => {
      pairSection.classList.remove('hidden');
      qrSection.classList.add('hidden');
      pairTab.className = 'flex-1 py-2 rounded-md bg-purple-600 text-white transition';
      qrTab.className = 'flex-1 py-2 rounded-md text-gray-400 transition';
    };

    qrTab.onclick = () => {
      qrSection.classList.remove('hidden');
      pairSection.classList.add('hidden');
      qrTab.className = 'flex-1 py-2 rounded-md bg-purple-600 text-white transition';
      pairTab.className = 'flex-1 py-2 rounded-md text-gray-400 transition';
    };

    async function getPairCode() {
      const phone = document.getElementById('phone').value;
      if (!phone) return alert('اكتب رقم الواتساب');
      document.getElementById('status').innerText = '⏳ جاري توليد الكود...';
      try {
        const res = await fetch(`/pair?number=${phone}`);
        const data = await res.json();
        if (data.code && data.code !== 'SUCCESS') {
          document.getElementById('codeDisplay').innerText = data.code;
          document.getElementById('pairResult').classList.remove('hidden');
          document.getElementById('status').innerText = '✅ تم توليد الكود';
        } else if (data.code === 'SUCCESS') {
          document.getElementById('status').innerText = '✅ تم الربط بنجاح وجاري إرسال الجلسة للبوت الرئيسي';
        }
      } catch (e) {
        document.getElementById('status').innerText = '❌ حدث خطأ';
      }
    }

    async function getQRCode() {
      document.getElementById('status').innerText = '⏳ جاري توليد كود QR...';
      try {
        const res = await fetch('/qr');
        const data = await res.json();
        if (data.qr) {
          document.getElementById('qrImage').src = data.qr;
          document.getElementById('qrResult').classList.remove('hidden');
          document.getElementById('status').innerText = '✅ امسح الكود الآن';
        }
      } catch (e) {
        document.getElementById('status').innerText = '❌ حدث خطأ';
      }
    }
  </script>
</body>
</html>

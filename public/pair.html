<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔗 Pairing Code | سوكونا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a1e 0%, #1a0033 50%, #000022 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.2) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.15) 0%, transparent 50%);
  pointer-events: none;
}
.card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(138, 43, 226, 0.3);
  border-radius: 25px;
  padding: 40px;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: fadeInUp 0.8s ease;
  position: relative;
  z-index: 1;
}
.back-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-decoration: none;
  transition: all 0.3s;
}
.back-btn:hover { background: rgba(138, 43, 226, 0.5); transform: scale(1.1); }

.header {
  text-align: center;
  margin-bottom: 30px;
}
.logo-icon {
  font-size: 4rem;
  background: linear-gradient(135deg, #8a2be2, #00bfff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.5));
}
.title {
  font-size: 2rem;
  font-weight: 900;
  margin-bottom: 5px;
}
.subtitle { color: #b0b0d0; }

.form-group { margin-bottom: 20px; }
label {
  display: block;
  margin-bottom: 8px;
  font-weight: 700;
  color: #d0d0f0;
}
.input-wrapper {
  display: flex;
  gap: 10px;
  background: rgba(0,0,0,0.3);
  border: 2px solid rgba(138, 43, 226, 0.3);
  border-radius: 15px;
  padding: 5px;
  transition: all 0.3s;
}
.input-wrapper:focus-within {
  border-color: #00bfff;
  box-shadow: 0 0 20px rgba(0, 191, 255, 0.3);
}
.country-select {
  background: rgba(138, 43, 226, 0.2);
  color: #fff;
  border: none;
  padding: 12px 15px;
  border-radius: 10px;
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  cursor: pointer;
  min-width: 100px;
}
.country-select option { background: #1a0033; }
.phone-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 1.1rem;
  padding: 12px 15px;
  outline: none;
  font-family: 'Tajawal', sans-serif;
  direction: ltr;
  text-align: right;
}
.phone-input::placeholder { color: rgba(255,255,255,0.4); }

.submit-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #8a2be2, #00bfff);
  color: #fff;
  border: none;
  border-radius: 15px;
  font-size: 1.1rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Tajawal', sans-serif;
  box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
}
.submit-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(138, 43, 226, 0.6);
}
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.result-box {
  margin-top: 25px;
  padding: 25px;
  background: rgba(0, 191, 255, 0.1);
  border: 2px solid rgba(0, 191, 255, 0.3);
  border-radius: 15px;
  display: none;
  animation: fadeInUp 0.5s ease;
}
.result-box.success { border-color: #00ff88; background: rgba(0, 255, 136, 0.1); }
.result-box.error { border-color: #ff4444; background: rgba(255, 68, 68, 0.1); }

.pair-code {
  font-size: 2.5rem;
  font-weight: 900;
  text-align: center;
  letter-spacing: 5px;
  padding: 20px;
  background: rgba(0,0,0,0.4);
  border-radius: 12px;
  margin: 15px 0;
  font-family: 'Courier New', monospace;
  color: #00bfff;
  text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
  direction: ltr;
}

.instructions {
  margin-top: 20px;
  padding: 20px;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  line-height: 2;
}
.instructions h4 {
  color: #00bfff;
  margin-bottom: 10px;
  font-size: 1.1rem;
}
.instructions ol { padding-right: 20px; }
.instructions li { margin-bottom: 5px; color: #d0d0f0; }

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-left: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.copy-btn {
  padding: 10px 20px;
  background: rgba(138, 43, 226, 0.3);
  border: 1px solid rgba(138, 43, 226, 0.5);
  color: #fff;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  font-weight: 700;
  transition: all 0.3s;
}
.copy-btn:hover { background: rgba(138, 43, 226, 0.6); }
</style>
</head>
<body>
<div class="card">
  <a href="/" class="back-btn"><i class="fas fa-arrow-right"></i></a>

  <div class="header">
    <div class="logo-icon"><i class="fas fa-key"></i></div>
    <div class="title">تنصيب بكود Pairing</div>
    <div class="subtitle">🕸 Sukuna Platform</div>
  </div>

  <form id="pairForm">
    <div class="form-group">
      <label><i class="fas fa-phone"></i> رقم الواتساب</label>
      <div class="input-wrapper">
        <select class="country-select" id="countryCode">
          <option value="20">🇪🇬 +20</option>
          <option value="966">🇸🇦 +966</option>
          <option value="971">🇦🇪 +971</option>
          <option value="974">🇶🇦 +974</option>
          <option value="965">🇰🇼 +965</option>
          <option value="973">🇧🇭 +973</option>
          <option value="968">🇴🇲 +968</option>
          <option value="962">🇯🇴 +962</option>
          <option value="961">🇱🇧 +961</option>
          <option value="964">🇮🇶 +964</option>
          <option value="963">🇸🇾 +963</option>
          <option value="212">🇲🇦 +212</option>
          <option value="213">🇩🇿 +213</option>
          <option value="216">🇹🇳 +216</option>
          <option value="218">🇱🇾 +218</option>
          <option value="249">🇸🇩 +249</option>
          <option value="967">🇾🇪 +967</option>
        </select>
        <input type="tel" class="phone-input" id="phone" placeholder="10XXXXXXXX" required>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      <i class="fas fa-bolt"></i> إنشاء كود الربط
    </button>
  </form>

  <div class="result-box" id="resultBox">
    <div id="resultContent"></div>
  </div>

  <div class="instructions">
    <h4><i class="fas fa-info-circle"></i> طريقة الاستخدام:</h4>
    <ol>
      <li>أدخل رقم الواتساب كاملاً</li>
      <li>اضغط على "إنشاء كود الربط"</li>
      <li>انسخ الكود اللي هيظهر</li>
      <li>افتح واتساب ← ⚙️ الإعدادات ← الأجهزة المرتبطة</li>
      <li>اضغط "ربط جهاز" ← "الربط برقم الهاتف"</li>
      <li>الصق الكود وانتظر الربط</li>
    </ol>
  </div>
</div>

<script>
const form = document.getElementById('pairForm');
const submitBtn = document.getElementById('submitBtn');
const resultBox = document.getElementById('resultBox');
const resultContent = document.getElementById('resultContent');
const countryCode = document.getElementById('countryCode');
const phoneInput = document.getElementById('phone');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const number = countryCode.value + phoneInput.value.replace(/\D/g, '');
  
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<i class="fas fa-spinner"></i> جاري إنشاء الكود... <span class="spinner"></span>';
  resultBox.style.display = 'none';

  try {
    const res = await fetch(`/api/pair?number=${number}`);
    const data = await res.json();

    if (data.success && data.code) {
      resultBox.className = 'result-box success';
      resultBox.style.display = 'block';
      resultContent.innerHTML = `
        <h3 style="color: #00ff88; text-align: center; margin-bottom: 15px;">
          <i class="fas fa-check-circle"></i> تم إنشاء الكود بنجاح!
        </h3>
        <div class="pair-code">${data.code}</div>
        <div style="text-align: center;">
          <button class="copy-btn" onclick="copyCode('${data.code}')">
            <i class="fas fa-copy"></i> نسخ الكود
          </button>
        </div>
        <p style="margin-top: 15px; text-align: center; color: #b0b0d0;">
          ⏳ الكود صالح لمدة 60 ثانية فقط
        </p>
      `;
    } else {
      resultBox.className = 'result-box error';
      resultBox.style.display = 'block';
      resultContent.innerHTML = `
        <h3 style="color: #ff4444; text-align: center;">
          <i class="fas fa-exclamation-circle"></i> خطأ
        </h3>
        <p style="text-align: center; margin-top: 10px;">${data.error || 'حدث خطأ غير متوقع'}</p>
      `;
    }
  } catch (err) {
    resultBox.className = 'result-box error';
    resultBox.style.display = 'block';
    resultContent.innerHTML = `
      <h3 style="color: #ff4444; text-align: center;">
        <i class="fas fa-exclamation-circle"></i> خطأ في الاتصال
      </h3>
      <p style="text-align: center; margin-top: 10px;">تأكد من اتصالك بالإنترنت وحاول مرة أخرى</p>
    `;
  }

  submitBtn.disabled = false;
  submitBtn.innerHTML = '<i class="fas fa-bolt"></i> إنشاء كود الربط';
});

function copyCode(code) {
  navigator.clipboard.writeText(code.replace(/-/g, ''));
  const btn = event.target.closest('button');
  const original = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
  setTimeout(() => btn.innerHTML = original, 2000);
}

// Format phone input
phoneInput.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 15);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 البوتات النشطة | سوكونا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a1e 0%, #1a0033 50%, #000022 100%);
  color: #fff;
  padding: 20px;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.1) 0%, transparent 50%);
  pointer-events: none;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 30px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(138, 43, 226, 0.3);
  border-radius: 20px;
  margin-bottom: 30px;
}
.title {
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(135deg, #8a2be2, #00bfff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.refresh-btn {
  padding: 12px 25px;
  background: linear-gradient(135deg, #8a2be2, #00bfff);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  transition: all 0.3s;
}
.refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(138, 43, 226, 0.5); }

.sessions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.session-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(138, 43, 226, 0.3);
  border-radius: 18px;
  padding: 25px;
  transition: all 0.3s;
  animation: fadeInUp 0.5s ease;
}
.session-card:hover {
  transform: translateY(-5px);
  border-color: #00bfff;
  box-shadow: 0 10px 30px rgba(0, 191, 255, 0.3);
}
.session-header {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-bottom: 15px;
}
.session-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #8a2be2, #00bfff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  font-weight: 900;
  color: #fff;
  box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
}
.session-name { font-size: 1.3rem; font-weight: 700; }
.session-number { color: #b0b0d0; font-size: 0.95rem; direction: ltr; text-align: right; }

.session-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.info-label { color: #b0b0d0; font-size: 0.9rem; }
.info-value { font-weight: 700; direction: ltr; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 20px;
  border: 2px dashed rgba(138, 43, 226, 0.3);
}
.empty-icon {
  font-size: 5rem;
  color: #8a2be2;
  margin-bottom: 20px;
  opacity: 0.5;
}
.empty-text { font-size: 1.3rem; color: #b0b0d0; margin-bottom: 20px; }

.loading {
  text-align: center;
  padding: 40px;
  font-size: 1.2rem;
  color: #b0b0d0;
}
.spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 4px solid rgba(138, 43, 226, 0.3);
  border-top-color: #8a2be2;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(138, 43, 226, 0.3);
  border-radius: 10px;
  color: #fff;
  text-decoration: none;
  margin-bottom: 20px;
  transition: all 0.3s;
}
.back-link:hover { background: rgba(138, 43, 226, 0.3); }
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">
    <i class="fas fa-arrow-right"></i> العودة للرئيسية
  </a>

  <div class="header">
    <div class="title"><i class="fas fa-robot"></i> البوتات النشطة</div>
    <button class="refresh-btn" onclick="loadSessions()">
      <i class="fas fa-sync-alt"></i> تحديث
    </button>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 15px;">جاري تحميل البوتات...</p>
    </div>
  </div>
</div>

<script>
async function loadSessions() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top: 15px;">جاري التحميل...</p></div>';

  try {
    const res = await fetch('/api/sessions');
    const data = await res.json();

    if (!data.success) throw new Error(data.error);

    if (data.sessions.length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon"><i class="fas fa-robot"></i></div>
          <div class="empty-text">لا توجد بوتات نشطة حالياً</div>
          <a href="/pair" class="refresh-btn">
            <i class="fas fa-plus"></i> تنصيب بوت جديد
          </a>
        </div>
      `;
      return;
    }

    const html = '<div class="sessions-grid">' + data.sessions.map(s => {
      const initial = (s.name || s.number || '?').charAt(0).toUpperCase();
      const date = new Date(s.createdAt).toLocaleString('ar-SA');
      return `
        <div class="session-card">
          <div class="session-header">
            <div class="session-avatar">${initial}</div>
            <div>
              <div class="session-name">${s.name || 'غير معروف'}</div>
              <div class="session-number">📱 ${s.number}</div>
            </div>
          </div>
          <div class="session-info">
            <div class="info-row">
              <span class="info-label"><i class="fas fa-fingerprint"></i> JID</span>
              <span class="info-value">${s.jid || '-'}</span>
            </div>
            <div class="info-row">
              <span class="info-label"><i class="fas fa-calendar"></i> تاريخ الإنشاء</span>
              <span class="info-value">${date}</span>
            </div>
            <div class="info-row">
              <span class="info-label"><i class="fas fa-check-circle" style="color: #00ff88;"></i> الحالة</span>
              <span class="info-value" style="color: #00ff88;">نشط</span>
            </div>
          </div>
        </div>
      `;
    }).join('') + '</div>';

    content.innerHTML = html;
  } catch (err) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon" style="color: #ff4444;"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="empty-text">خطأ في تحميل البوتات</div>
        <p style="color: #b0b0d0;">${err.message}</p>
      </div>
    `;
  }
}

loadSessions();
setInterval(loadSessions, 15000); // تحديث تلقائي كل 15 ثانية
</script>
</body>
</html>

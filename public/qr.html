<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ربط بالكاميرا | Sukuna Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #dc143c; --secondary: #ffd700; --dark: #0a0a0a; }
    * { font-family: 'Cairo', sans-serif; }
    body {
      background: var(--dark);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0505 100%);
    }
    .qr-card {
      background: rgba(20,20,20,0.95);
      border: 2px solid var(--primary);
      border-radius: 30px;
      padding: 3rem;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(220,20,60,0.3);
      text-align: center;
    }
    .qr-title {
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
    }
    .qr-image {
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 10px 40px rgba(220,20,60,0.3);
    }
    .qr-image img {
      max-width: 300px;
      width: 100%;
    }
    .status-badge {
      display: inline-block;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 2rem;
    }
    .status-waiting { background: rgba(255,215,0,0.2); color: var(--secondary); }
    .status-connected { background: rgba(0,255,0,0.2); color: #0f0; }
    .btn-start {
      background: linear-gradient(45deg, var(--primary), #8b0000);
      border: 2px solid var(--secondary);
      color: #fff;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 15px;
      margin: 1rem 0;
    }
    .btn-refresh {
      background: transparent;
      border: 2px solid var(--secondary);
      color: var(--secondary);
      padding: 10px 25px;
      border-radius: 15px;
      margin-top: 1rem;
    }
    .loading {
      display: none;
      margin: 2rem auto;
      width: 60px;
      height: 60px;
      border: 4px solid rgba(220,20,60,0.2);
      border-top-color: var(--secondary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: var(--secondary);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="qr-card">
    <a href="/" class="back-link"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    
    <h1 class="qr-title">
      <i class="fas fa-qrcode"></i> ربط بالكاميرا
    </h1>

    <button class="btn btn-start" id="startBtn" onclick="startQR()">
      <i class="fas fa-play"></i> بدء الربط
    </button>

    <div class="loading" id="loading"></div>

    <div id="qrContainer" style="display: none;">
      <div class="qr-image">
        <img id="qrImage" src="" alt="QR Code">
      </div>
      <div>
        <span class="status-badge status-waiting" id="statusBadge">
          <i class="fas fa-clock"></i> في انتظار المسح...
        </span>
      </div>
      <button class="btn btn-refresh" onclick="refreshQR()">
        <i class="fas fa-sync"></i> تحديث QR
      </button>
    </div>
  </div>

  <script>
    let currentSessionId = null;
    let checkInterval = null;

    async function startQR() {
      document.getElementById('startBtn').disabled = true;
      document.getElementById('loading').style.display = 'block';

      try {
        const response = await fetch('/api/qr/start', { method: 'POST' });
        const data = await response.json();

        if (data.success) {
          currentSessionId = data.sessionId;
          document.getElementById('qrImage').src = data.qrImage;
          document.getElementById('qrContainer').style.display = 'block';
          startStatusCheck();
        } else {
          alert('خطأ: ' + (data.error || 'فشل توليد QR'));
        }
      } catch (e) {
        alert('خطأ: ' + e.message);
      } finally {
        document.getElementById('startBtn').disabled = false;
        document.getElementById('loading').style.display = 'none';
      }
    }

    async function refreshQR() {
      if (!currentSessionId) return;
      try {
        const response = await fetch(`/api/qr/refresh/${currentSessionId}`);
        const data = await response.json();
        if (data.qrImage) {
          document.getElementById('qrImage').src = data.qrImage;
        }
      } catch (e) {
        console.error(e);
      }
    }

    function startStatusCheck() {
      if (checkInterval) clearInterval(checkInterval);
      checkInterval = setInterval(async () => {
        if (!currentSessionId) return;
        try {
          const response = await fetch(`/api/qr/status/${currentSessionId}`);
          const data = await response.json();

          const badge = document.getElementById('statusBadge');
          if (data.connected) {
            badge.className = 'status-badge status-connected';
            badge.innerHTML = '<i class="fas fa-check-circle"></i> تم الربط بنجاح!';
            clearInterval(checkInterval);
            setTimeout(() => {
              alert('✅ تم ربط البوت بنجاح!');
              window.location.href = '/dashboard';
            }, 1000);
          } else if (data.status === 'expired') {
            badge.className = 'status-badge status-error';
            badge.innerHTML = '<i class="fas fa-times-circle"></i> انتهت الجلسة';
            clearInterval(checkInterval);
          }
        } catch (e) {
          console.error(e);
        }
      }, 3000);
    }
  </script>
</body>
</html>

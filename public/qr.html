<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔳 QR Code | سوكونا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0a0a1e 0%, #1a0033 50%, #000022 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(138, 43, 226, 0.2) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.15) 0%, transparent 50%);
  pointer-events: none;
}
.card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(138, 43, 226, 0.3);
  border-radius: 25px;
  padding: 40px;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: fadeInUp 0.8s ease;
  position: relative;
  z-index: 1;
}
.back-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-decoration: none;
  transition: all 0.3s;
}
.back-btn:hover { background: rgba(138, 43, 226, 0.5); transform: scale(1.1); }

.header { text-align: center; margin-bottom: 30px; }
.logo-icon {
  font-size: 4rem;
  background: linear-gradient(135deg, #8a2be2, #00bfff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
  filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.5));
}
.title { font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
.subtitle { color: #b0b0d0; }

.qr-container {
  background: #fff;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  margin: 20px 0;
  box-shadow: 0 0 40px rgba(138, 43, 226, 0.3);
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qr-container img { max-width: 100%; height: auto; }
.qr-loading {
  color: #8a2be2;
  font-size: 1.2rem;
  font-weight: 700;
}

.generate-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #8a2be2, #00bfff);
  color: #fff;
  border: none;
  border-radius: 15px;
  font-size: 1.1rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Tajawal', sans-serif;
  box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
  margin-bottom: 20px;
}
.generate-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(138, 43, 226, 0.6);
}
.generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.status-msg {
  text-align: center;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
  font-weight: 700;
  display: none;
}
.status-msg.info { background: rgba(0, 191, 255, 0.1); color: #00bfff; border: 1px solid rgba(0, 191, 255, 0.3); }
.status-msg.success { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid rgba(0, 255, 136, 0.3); }
.status-msg.error { background: rgba(255, 68, 68, 0.1); color: #ff4444; border: 1px solid rgba(255, 68, 68, 0.3); }

.instructions {
  margin-top: 20px;
  padding: 20px;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  line-height: 2;
}
.instructions h4 { color: #00bfff; margin-bottom: 10px; }
.instructions ol { padding-right: 20px; }
.instructions li { margin-bottom: 5px; color: #d0d0f0; }

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-left: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="back-btn"><i class="fas fa-arrow-right"></i></a>

  <div class="header">
    <div class="logo-icon"><i class="fas fa-qrcode"></i></div>
    <div class="title">تنصيب بـ QR Code</div>
    <div class="subtitle">🕸 Sukuna Platform</div>
  </div>

  <button class="generate-btn" id="generateBtn" onclick="generateQR()">
    <i class="fas fa-qrcode"></i> توليد كود QR جديد
  </button>

  <div class="qr-container" id="qrContainer">
    <div class="qr-loading">
      <i class="fas fa-qrcode" style="font-size: 4rem; opacity: 0.3;"></i>
      <p style="margin-top: 15px;">اضغط الزر لتوليد الكود</p>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="instructions">
    <h4><i class="fas fa-info-circle"></i> طريقة الاستخدام:</h4>
    <ol>
      <li>اضغط على "توليد كود QR جديد"</li>
      <li>انتظر ظهور الكود</li>
      <li>افتح واتساب على هاتفك</li>
      <li>اذهب إلى ⚙️ الإعدادات ← الأجهزة المرتبطة 🔗</li>
      <li>اضغط "ربط جهاز"</li>
      <li>امسح الكود بكاميرا الهاتف</li>
      <li>انتظر حتى يتم الربط بنجاح</li>
    </ol>
  </div>
</div>

<script>
const container = document.getElementById('qrContainer');
const btn = document.getElementById('generateBtn');
const statusMsg = document.getElementById('statusMsg');

async function generateQR() {
  btn.disabled = true;
  btn.innerHTML = 'جاري التوليد... <span class="spinner"></span>';
  container.innerHTML = '<div class="qr-loading"><i class="fas fa-spinner fa-spin" style="font-size: 3rem;"></i><p>جاري توليد الكود...</p></div>';
  statusMsg.style.display = 'none';

  try {
    const res = await fetch('/api/qr');
    const data = await res.json();

    if (data.success && data.qr) {
      container.innerHTML = `<img src="${data.qr}" alt="QR Code">`;
      statusMsg.className = 'status-msg info';
      statusMsg.style.display = 'block';
      statusMsg.innerHTML = '<i class="fas fa-clock"></i> امسح الكود خلال 60 ثانية';
      
      // تحديث تلقائي بعد انتهاء الصلاحية
      setTimeout(() => {
        if (container.querySelector('img')) {
          statusMsg.className = 'status-msg error';
          statusMsg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> انتهت صلاحية الكود، اضغط لتوليد كود جديد';
        }
      }, 60000);
    } else {
      container.innerHTML = '<div class="qr-loading"><i class="fas fa-exclamation-circle" style="color: #ff4444; font-size: 3rem;"></i><p>فشل توليد الكود</p></div>';
      statusMsg.className = 'status-msg error';
      statusMsg.style.display = 'block';
      statusMsg.innerHTML = data.error || 'حدث خطأ غير متوقع';
    }
  } catch (err) {
    container.innerHTML = '<div class="qr-loading"><i class="fas fa-exclamation-circle" style="color: #ff4444; font-size: 3rem;"></i><p>خطأ في الاتصال</p></div>';
    statusMsg.className = 'status-msg error';
    statusMsg.style.display = 'block';
    statusMsg.innerHTML = 'تأكد من اتصالك بالإنترنت';
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-qrcode"></i> توليد كود QR جديد';
}
</script>
</body>
</html>

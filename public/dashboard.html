<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | Sukuna Platform</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ═══ Navigation ═══ -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <span class="logo-icon">🕸</span>
        <span class="logo-text">Sukuna</span>
      </div>
      <div class="nav-links">
        <a href="/" class="nav-link">الرئيسية</a>
        <a href="/dashboard" class="nav-link active">لوحة التحكم</a>
        <a href="/connect" class="nav-link">تنصيب بوت</a>
      </div>
      <div class="nav-cta">
        <a href="/connect" class="btn btn-primary">+ بوت جديد</a>
      </div>
    </div>
  </nav>

  <!-- ═══ Dashboard ═══ -->
  <section class="dashboard">
    <div class="container">
      <div class="dashboard-header">
        <h1>📊 لوحة التحكم</h1>
        <p>إدارة الجلسات والإحصائيات</p>
      </div>

      <!-- ═══ Stats Cards ═══ -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">📱</div>
          <div class="stat-info">
            <span class="stat-value" id="total-sessions">0</span>
            <span class="stat-label">إجمالي الجلسات</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-info">
            <span class="stat-value" id="active-sessions">0</span>
            <span class="stat-label">جلسات نشطة</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏱️</div>
          <div class="stat-info">
            <span class="stat-value" id="uptime">0s</span>
            <span class="stat-label">وقت التشغيل</span>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🚀</div>
          <div class="stat-info">
            <span class="stat-value">v2.0.0</span>
            <span class="stat-label">الإصدار</span>
          </div>
        </div>
      </div>

      <!-- ═══ Sessions Table ═══ -->
      <div class="sessions-section">
        <div class="section-header">
          <h2>💾 الجلسات المحفوظة</h2>
          <button class="btn btn-secondary" id="refresh-btn">🔄 تحديث</button>
        </div>
        <div class="sessions-table-wrapper">
          <table class="sessions-table">
            <thead>
              <tr>
                <th>#</th>
                <th>رقم البوت</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="sessions-tbody">
              <tr>
                <td colspan="4" class="loading-row">جاري التحميل...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ Footer ═══ -->
  <footer class="footer">
    <div class="container">
      <p class="footer-text">
        © 2025 Sukuna Team | Powered by Adam (Shadow)
      </p>
    </div>
  </footer>

  <script src="/assets/script.js"></script>
  <script src="/assets/dashboard.js"></script>
</body>
</html>
